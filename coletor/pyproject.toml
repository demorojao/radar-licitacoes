[project]
name = "radar-coletor"
version = "0.1.0"
description = "Coleta licitações abertas de SC na API do PNCP e grava no Postgres"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",     # cliente HTTP com timeout e MockTransport (testes sem rede)
    "pydantic>=2.14.3",  # validação dos dados da API
    "tzdata>=2026.6",    # base de fusos horários: o Windows não traz uma para o Python
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W: estilo (pycodestyle) · F: erros (pyflakes) · I: ordem dos imports · UP: sintaxe moderna
# B: armadilhas comuns (bugbear) · SIM: simplificações · RUF: regras do próprio ruff
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest]
testpaths = ["tests"]
