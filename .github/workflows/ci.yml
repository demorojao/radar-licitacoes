name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo cancela a execução anterior do mesmo branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Menor privilégio: o CI só precisa ler o código.
permissions:
  contents: read

jobs:
  coletor:
    name: Coletor (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coletor
    steps:
      - uses: actions/checkout@v7

      # Action de terceiros fixada pelo hash do commit (uma tag pode ser movida; o hash não).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: coletor
          enable-cache: true

      - name: Instala as dependências exatamente como no uv.lock
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formatação
        run: uv run ruff format --check .

      - name: Tipos (mypy strict)
        run: uv run mypy

      - name: Testes
        run: uv run pytest

  web:
    name: Site (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instala as dependências exatamente como no package-lock.json
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Build
        run: npm run build
