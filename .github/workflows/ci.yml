name: CI

on:
  # Qualquer branch: dá para ver o CI passar antes de levar a mudança para a main.
  push:
    branches: ["**"]
  pull_request:

# Um push novo cancela a execução anterior do mesmo branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Menor privilégio: o CI só precisa ler o código.
permissions:
  contents: read

jobs:
  coletor:
    name: Coletor (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coletor
    # Postgres descartável para os testes de integração (mesma versão do Supabase: 17).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # No CI, os testes de banco não podem ser pulados.
      EXIGIR_BANCO_DE_TESTE: "1"
    steps:
      - uses: actions/checkout@v7

      # Action de terceiros fixada pelo hash do commit (uma tag pode ser movida; o hash não).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: coletor
          enable-cache: true

      - name: Instala as dependências exatamente como no uv.lock
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formatação
        run: uv run ruff format --check .

      - name: Tipos (mypy strict)
        run: uv run mypy

      - name: Testes
        # Cada teste que falha vira uma anotação (::error) no resumo do CI, legível sem abrir o log.
        run: |
          set -o pipefail
          uv run pytest -rfE 2>&1 | tee pytest.log || {
            grep -E '^(FAILED|ERROR) ' pytest.log | cut -c1-900 | sed 's/^/::error title=pytest::/'
            exit 1
          }

  web:
    name: Site (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instala as dependências exatamente como no package-lock.json
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
